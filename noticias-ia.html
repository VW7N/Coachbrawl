<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrawlCoach - Noticias & Cambios de Balance</title>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top center, #1e1b4b 0%, #0b1020 60%, #05070d 100%);
      color: white;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Fondo de iluminación violeta */
    body::before {
      content: '';
      position: absolute;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 300px;
      background: rgba(139, 92, 246, 0.15);
      filter: blur(120px);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    /* Botón de volver */
    .back-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #9ca3af;
      border: 1px solid #34405f;
      border-radius: 11px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      margin-bottom: 25px;
    }

    .back-button:hover {
      color: white;
      border-color: #a78bfa;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      font-size: 38px;
      font-weight: 900;
      margin-bottom: 10px;
      text-shadow: 0 0 25px rgba(139, 92, 246, 0.3);
    }

    .logo span {
      color: #a78bfa;
    }

    h1 {
      font-size: 38px;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    h1 span {
      color: #a78bfa;
      text-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
    }

    .description {
      color: #9ca3af;
      font-size: 15px;
      line-height: 1.6;
      max-width: 650px;
      margin: 0 auto;
    }

    .card {
      background: rgba(21, 28, 50, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(139, 92, 246, 0.1);
    }

    /* Cabecera del contenedor de noticias */
    .news-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .status-badge {
      font-size: 12px;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #10b981;
      animation: pulse-dot 1.6s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* Grid de Noticias */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
      margin-top: 20px;
    }

    .news-card {
      background: rgba(13, 20, 39, 0.75);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .news-card.is-new {
      animation: highlight-new 2.5s ease-out;
    }

    @keyframes highlight-new {
      0% { box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.9); }
      100% { box-shadow: 0 0 0 0 rgba(167, 139, 250, 0); }
    }

    .news-card:hover {
      transform: translateY(-4px);
      border-color: rgba(167, 139, 250, 0.5);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .news-image {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-bottom: 1px solid rgba(139, 92, 246, 0.15);
    }

    .news-body {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .news-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .news-tag {
      font-size: 11px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tag-buff {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .tag-nerf {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .tag-event {
      background: rgba(167, 139, 250, 0.15);
      color: #a78bfa;
      border: 1px solid rgba(167, 139, 250, 0.3);
    }

    .news-time {
      font-size: 11px;
      color: #64748b;
    }

    .news-title {
      font-size: 17px;
      font-weight: bold;
      color: white;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .news-summary {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .news-footer {
      font-size: 11px;
      color: #64748b;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      padding-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .empty-state {
      text-align: center;
      color: #94a3b8;
      grid-column: 1 / -1;
      padding: 40px 0;
    }

    @media (max-width: 600px) {
      .news-grid { grid-template-columns: 1fr; }
      .card { padding: 20px; }
      h1 { font-size: 28px; }
    }
  </style>
</head>

<body>

<div class="page">
  <div class="container">

    <a href="./index.html" class="back-button">
      ← Volver al inicio
    </a>

    <div class="header">
      <div class="logo">
        Brawl<span>Coach</span>
      </div>
      <h1>
        📰 <span>Noticias</span> & Cambios de Balance
      </h1>
      <p class="description">
        Notas de parche, eventos y ajustes de balance de Brawl Stars, actualizados automáticamente en cuanto se publican.
      </p>
    </div>

    <div class="card">
      <div class="news-header">
        <h2>🔥 Últimas Novedades</h2>
        <div class="status-badge">
          En vivo
        </div>
      </div>

      <!-- CONTENEDOR DE NOTICIAS -->
      <div id="newsContainer" class="news-grid">
        <div class="empty-state">Cargando las últimas noticias...</div>
      </div>
    </div>

  </div>
</div>

<script>
  /* CONFIGURACIÓN SUPABASE */
  const SUPABASE_URL = "https://wzbdwcovghhcjbiedmuh.supabase.co";
  const SUPABASE_KEY = "sb_publishable_VD7Kf7j3RrEHg2RvVOQ6FA_H4FuT_k-";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const knownIds = new Set();

  /* OBTENER Y RENDERIZAR LAS NOTICIAS MÁS RECIENTES */
  async function fetchLatestNews() {
    const { data: news, error } = await supabaseClient
      .from('brawl_news')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(6);

    if (error) {
      console.error("Error consultando noticias:", error.message);
      return null;
    }
    return news;
  }

  async function loadNews() {
    const news = await fetchLatestNews();

    if (!news || news.length === 0) {
      document.getElementById("newsContainer").innerHTML =
        `<div class="empty-state">No hay noticias publicadas todavía. Vuelve a comprobarlo en breve.</div>`;
      return;
    }

    news.forEach(item => knownIds.add(item.id));
    renderNewsList(news);
  }

  function renderNewsList(items, highlightNew = false) {
    const newsContainer = document.getElementById("newsContainer");
    newsContainer.innerHTML = "";

    items.forEach(item => {
      let tagClass = "tag-event";
      if (item.category === 'BUFF') tagClass = "tag-buff";
      if (item.category === 'NERF') tagClass = "tag-nerf";

      const card = document.createElement("div");
      card.className = "news-card" + (highlightNew ? " is-new" : "");
      card.innerHTML = `
        <img src="${item.image_url}" alt="${item.title}" class="news-image" onerror="this.src='https://cdn-old.brawlify.com/brawlers/borders/16000000.png'">
        <div class="news-body">
          <div>
            <div class="news-meta">
              <span class="news-tag ${tagClass}">${item.category}</span>
              <span class="news-time">${item.formatted_time || 'Hace poco'}</span>
            </div>
            <h3 class="news-title">${item.title}</h3>
            <p class="news-summary">${item.summary}</p>
          </div>
          <div class="news-footer">
            <span>Fuente verificada</span>
            <span>${item.sources_count ? item.sources_count + ' fuentes' : ''}</span>
          </div>
        </div>
      `;
      newsContainer.appendChild(card);
    });
  }

  /* Refresco periódico: por si el proyecto no tiene Realtime activado en la tabla,
     esto garantiza que cualquiera que esté en la página vea las noticias más nuevas. */
  async function pollForUpdates() {
    const news = await fetchLatestNews();
    if (!news) return;

    const hasNew = news.some(item => !knownIds.has(item.id));
    if (hasNew) {
      news.forEach(item => knownIds.add(item.id));
      renderNewsList(news, true);
    }
  }

  /* Actualización instantánea vía Supabase Realtime cuando se inserta una noticia nueva.
     Requiere tener activado "Realtime" para la tabla brawl_news en el proyecto de Supabase. */
  function subscribeToRealtimeUpdates() {
    supabaseClient
      .channel('brawl_news-changes')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'brawl_news' }, () => {
        loadNews().then(() => {
          const firstCard = document.querySelector('.news-card');
          if (firstCard) firstCard.classList.add('is-new');
        });
      })
      .subscribe();
  }

  // Al entrar a la página: cargar noticias, suscribirse a cambios en vivo,
  // y además comprobar cada 60s como respaldo.
  window.addEventListener("DOMContentLoaded", () => {
    loadNews();
    subscribeToRealtimeUpdates();
    setInterval(pollForUpdates, 60000);
  });
</script>

</body>
</html>
