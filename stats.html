<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrawlCoach - Stats</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
    }

    .logo span {
      color: #ffd43b;
    }

    .nav-buttons a {
      background: #151c32;
      border: 1px solid #27314d;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .search-card {
      background: #151c32;
      border: 1px solid #27314d;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #34405f;
      border-radius: 8px;
      background: #0d1427;
      color: white;
      font-size: 15px;
      outline: none;
      text-transform: uppercase;
    }

    .btn-primary {
      background: #ffd43b;
      color: #111827;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: #151c32;
      border: 1px solid #27314d;
      border-radius: 16px;
      padding: 20px;
    }

    .card h3 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #8f9ab2;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #1f2942;
    }

    .metric-row:last-child {
      border-bottom: none;
    }

    .label {
      color: #8f9ab2;
      font-size: 14px;
    }

    .value {
      font-weight: bold;
      font-size: 15px;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 14px;
      color: #ef4444;
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <header class="top-bar">
    <div class="logo">Brawl<span>Coach</span></div>
    <div class="nav-buttons">
      <a href="index.html">Inicio</a>
    </div>
  </header>

  <section class="search-card">
    <h2>Consultar Jugador</h2>
    <div class="search-box">
      <input id="playerTagInput" class="input" type="text" placeholder="#TAG DEL JUGADOR">
      <button id="searchBtn" class="btn-primary" onclick="fetchPlayerStats()">Buscar</button>
    </div>
    <div id="statusMsg" class="status-msg"></div>
  </section>

  <!-- PANEL DE ESTADÍSTICAS -->
  <div class="stats-grid">

    <!-- PERFIL Y COPAS -->
    <div class="card">
      <h3>Perfil</h3>
      <div class="metric-row">
        <span class="label">Nombre</span>
        <span id="dispName" class="value">-</span>
      </div>
      <div class="metric-row">
        <span class="label">Tag</span>
        <span id="dispTag" class="value">-</span>
      </div>
      <div class="metric-row">
        <span class="label">Copas Actuales</span>
        <span id="dispTrophies" class="value" style="color: #ffd43b;">-</span>
      </div>
      <div class="metric-row">
        <span class="label">Máximas Copas</span>
        <span id="dispMaxTrophies" class="value">-</span>
      </div>
      <div class="metric-row">
        <span class="label">Nivel de EXP</span>
        <span id="dispExpLevel" class="value">-</span>
      </div>
    </div>

    <!-- VICTORIAS Y CLUB -->
    <div class="card">
      <h3>Estadísticas de Juego</h3>
      <div class="metric-row">
        <span class="label">Victorias 3c3</span>
        <span id="disp3v3" class="value">-</span>
      </div>
      <div class="metric-row">
        <span class="label">Victorias Solo</span>
        <span id="dispSolo" class="value">-</span>
      </div>
      <div class="metric-row">
        <span class="label">Victorias Dúo</span>
        <span id="dispDuo" class="value">-</span>
      </div>
      <div class="metric-row">
        <span class="label">Club</span>
        <span id="dispClub" class="value" style="color: #3b82f6;">-</span>
      </div>
    </div>

  </div>

</div>

<script>
  async function fetchPlayerStats() {
    const rawTag = document.getElementById("playerTagInput").value.trim().toUpperCase();
    const cleanTag = rawTag.replace("#", "");
    const statusMsg = document.getElementById("statusMsg");
    const searchBtn = document.getElementById("searchBtn");

    if (!cleanTag) {
      showError("Introduce un Tag válido.");
      return;
    }

    statusMsg.style.display = "none";
    searchBtn.textContent = "Buscando...";
    searchBtn.disabled = true;

    try {
      // Consulta directamente a la API pública mediante CORS proxy
      const response = await fetch(`https://api.brawlify.com/v1/player/${cleanTag}`);
      
      if (!response.ok) {
        throw new Error("Jugador no encontrado.");
      }

      const data = await response.json();

      // Asignar los datos del JSON devuelto a los elementos HTML
      document.getElementById("dispName").textContent = data.name || "N/D";
      document.getElementById("dispTag").textContent = "#" + (data.tag || cleanTag);
      document.getElementById("dispTrophies").textContent = (data.trophies ?? 0).toLocaleString();
      document.getElementById("dispMaxTrophies").textContent = (data.highestTrophies ?? 0).toLocaleString();
      document.getElementById("dispExpLevel").textContent = data.expLevel ?? "-";
      
      document.getElementById("disp3v3").textContent = (data['3vs3Victories'] ?? 0).toLocaleString();
      document.getElementById("dispSolo").textContent = (data.soloVictories ?? 0).toLocaleString();
      document.getElementById("dispDuo").textContent = (data.duoVictories ?? 0).toLocaleString();
      document.getElementById("dispClub").textContent = data.club ? data.club.name : "Sin Club";

    } catch (err) {
      showError("No se pudieron consultar las estadísticas. Verifica el Tag.");
    } finally {
      searchBtn.textContent = "Buscar";
      searchBtn.disabled = false;
    }
  }

  function showError(msg) {
    const statusMsg = document.getElementById("statusMsg");
    statusMsg.textContent = msg;
    statusMsg.style.display = "block";
  }
</script>

</body>
</html>
